<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Timesheet — 15-Day Pay Period</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#171B22;
    --paper:#EDEEEA;
    --paper-raised:#F8F8F5;
    --row-alt: rgba(23,27,34,0.03);
    --amber:#B9791F;
    --amber-strong:#96600F;
    --teal:#2E4E48;
    --teal-strong:#22392F;
    --line: rgba(23,27,34,0.14);
    --line-soft: rgba(23,27,34,0.08);
    --danger:#A23D26;
    --text:#191D24;
    --text-soft:#5B6270;
    --text-faint:#8B9099;
    --focus: #96600F;
    --shadow: 0 1px 2px rgba(23,27,34,0.06);
    --radius: 10px;
  }
  :root:not([data-theme="light"]){
    /* placeholder for dark override guard, actual values below in media query & explicit dark */
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#EDEEEA;
      --paper:#12151B;
      --paper-raised:#1A1E26;
      --row-alt: rgba(255,255,255,0.025);
      --amber:#E0A24C;
      --amber-strong:#F0B565;
      --teal:#6FA598;
      --teal-strong:#8AC0B2;
      --line: rgba(255,255,255,0.14);
      --line-soft: rgba(255,255,255,0.08);
      --danger:#D97C5F;
      --text:#EDEEEA;
      --text-soft:#A7ACB5;
      --text-faint:#767C86;
      --focus:#E0A24C;
      --shadow: 0 1px 2px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"]{
    --ink:#EDEEEA;
    --paper:#12151B;
    --paper-raised:#1A1E26;
    --row-alt: rgba(255,255,255,0.025);
    --amber:#E0A24C;
    --amber-strong:#F0B565;
    --teal:#6FA598;
    --teal-strong:#8AC0B2;
    --line: rgba(255,255,255,0.14);
    --line-soft: rgba(255,255,255,0.08);
    --danger:#D97C5F;
    --text:#EDEEEA;
    --text-soft:#A7ACB5;
    --text-faint:#767C86;
    --focus:#E0A24C;
    --shadow: 0 1px 2px rgba(0,0,0,0.4);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0; max-width:100%; overflow-x:hidden;}
  body{
    background:var(--paper);
    color:var(--text);
    font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }
  .mono{ font-family:'IBM Plex Mono', 'SFMono-Regular', Menlo, monospace; font-feature-settings:"tnum" 1; font-variant-numeric: tabular-nums; }

  a{color:inherit;}
  button{font-family:inherit;}
  input{font-family:inherit;}

  /* ---------- Top bar ---------- */
  .topbar{
    padding: 12px 16px 10px;
    max-width: 980px;
    margin: 0 auto;
  }
  .brandrow{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:10px;
  }
  .brand h1{
    font-size:19px;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0;
  }
  .brand .sub{
    color:var(--text-soft);
    font-size:13px;
    margin-top:2px;
  }

  .controls-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
  }
  .controls-left, .controls-right{
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:wrap;
  }

  .field-label{
    font-size:11px;
    color:var(--text-faint);
    margin-bottom:4px;
    display:block;
  }

  .seg{
    display:inline-flex;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:8px;
    padding:2px;
    gap:2px;
  }
  .seg button{
    border:none;
    background:transparent;
    color:var(--text-soft);
    font-size:12.5px;
    padding:6px 10px;
    border-radius:6px;
    cursor:pointer;
    white-space:nowrap;
  }
  .seg button.active{
    background:var(--teal);
    color:#fff;
  }
  :root[data-theme="dark"] .seg button.active{ color:#0e140f; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .seg button.active{ color:#0e140f; }
  }

  .icon-btn{
    border:1px solid var(--line);
    background:var(--paper-raised);
    color:var(--text-soft);
    border-radius:8px;
    padding:7px 12px;
    font-size:13px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .icon-btn:hover{ border-color: var(--text-soft); color:var(--text); }
  .icon-btn:disabled{ opacity:.4; cursor:not-allowed; }
  .icon-btn.danger:hover{ border-color: var(--danger); color:var(--danger); }

  /* ---------- Totals bar ---------- */
  .totals-bar{
    position: sticky;
    top:0;
    z-index: 30;
    background: var(--paper);
    border-bottom:1px solid var(--line);
    backdrop-filter: blur(6px);
  }
  .totals-inner{
    max-width:980px;
    margin:0 auto;
    padding:8px 16px;
    display:flex;
    align-items:center;
    gap:22px;
    flex-wrap:wrap;
  }
  .totals-block{ display:flex; align-items:baseline; gap:8px; }
  .totals-num{
    font-size:26px;
    font-weight:600;
    color:var(--amber-strong);
    line-height:1;
  }
  .totals-label{
    font-size:12px;
    color:var(--text-soft);
  }
  .rate-input-wrap{
    display:flex;
    align-items:center;
    gap:6px;
    margin-left:auto;
  }
  .rate-input-wrap .totals-label{ margin-right:2px; }
  .rate-input{
    width:82px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:7px;
    padding:6px 8px;
    font-size:16px;
    color:var(--text);
    outline:none;
  }
  .rate-input:focus{ border-color:var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }

  /* ---------- Day list ---------- */
  .sheet{
    max-width:980px;
    margin: 6px auto 0;
    padding: 0 12px 24px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
  }
  .col-headers{
    display:grid;
    grid-template-columns: 30px minmax(126px,1fr) minmax(126px,1fr) 112px;
    gap:8px;
    padding: 6px 12px 6px 10px;
    font-size:11px;
    color:var(--text-faint);
    min-width:440px;
  }
  .row{
    display:grid;
    grid-template-columns: 30px minmax(126px,1fr) minmax(126px,1fr) 112px;
    align-items:center;
    gap:8px;
    padding: 6px 12px 6px 10px;
    border-radius:6px;
    border-bottom:1px solid var(--line-soft);
    min-width:440px;
  }
  .row:nth-child(even){ background: var(--row-alt); }
  .row.filled .daytotal{ color:var(--amber-strong); }

  .daylabel{
    font-size:13px;
    font-weight:500;
    color:var(--text-soft);
    position:sticky;
    left:0;
    background-color:var(--paper);
    z-index:2;
  }
  .col-headers > div:first-child{
    position:sticky;
    left:0;
    background-color:var(--paper);
    z-index:2;
  }

  .timefield{
    display:flex;
    align-items:center;
    gap:3px;
  }
  .seg-num{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:stretch;
  }
  .seg-input{
    width:32px;
    text-align:center;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:6px;
    font-size:16px;
    padding:5px 1px;
    color:var(--text);
    outline:none;
    -moz-appearance: textfield;
  }
  .seg-input::-webkit-outer-spin-button, .seg-input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .seg-input:focus{ border-color:var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
  .seg-input.empty{ color: var(--text-faint); }
  .colon{ color:var(--text-faint); font-size:13px; }
  .ampm-btn{
    border:1px solid var(--line);
    background:var(--paper-raised);
    color:var(--text-soft);
    font-size:11.5px;
    font-weight:600;
    padding:6px 6px;
    border-radius:6px;
    cursor:pointer;
    min-width:30px;
    letter-spacing:0.02em;
  }
  .ampm-btn.pm{ background:var(--teal); color:#fff; border-color:var(--teal); }
  @media (prefers-color-scheme: dark){ .ampm-btn.pm{ color:#0e140f; } }
  :root[data-theme="dark"] .ampm-btn.pm{ color:#0e140f; }
  .ampm-btn.am{ background:transparent; }

  .arrow-sep{ color: var(--text-faint); padding:0 1px; font-size:12px; }

  .rowfoot{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:6px;
  }
  .daytotal{
    font-size:13px;
    font-weight:600;
    color:var(--text-faint);
    white-space:nowrap;
    margin-right:auto;
  }

  .rowactions{
    display:flex;
    gap:4px;
  }
  .row-btn{
    border:1px solid var(--line);
    background:var(--paper-raised);
    color:var(--text-soft);
    cursor:pointer;
    font-size:13px;
    padding:0;
    width:26px;
    height:26px;
    border-radius:6px;
    line-height:1;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .row-btn:hover{ border-color:var(--text-soft); color:var(--text); }
  .row-btn.danger:hover{ border-color:var(--danger); color:var(--danger); }
  .icon-btn.confirm-armed, .row-btn.confirm-armed{
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
    animation: confirmPulse 1.1s ease-in-out infinite;
  }
  @keyframes confirmPulse{ 0%,100%{ opacity:1; } 50%{ opacity:.72; } }
  @media (prefers-reduced-motion: reduce){
    .icon-btn.confirm-armed, .row-btn.confirm-armed{ animation:none; }
  }

  @media (max-width: 480px){
    .totals-num{ font-size:20px; }
    .totals-inner{ gap:12px 16px; }
    .rate-input-wrap{ margin-left:0; }
  }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0;
    background: rgba(10,12,15,0.5);
    display:flex; align-items:center; justify-content:center;
    z-index:100;
    padding:20px;
  }
  .modal{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:12px;
    padding:22px;
    max-width:360px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.25);
  }
  .modal h3{ margin:0 0 8px; font-size:16px; }
  .modal p{ margin:0 0 18px; font-size:13.5px; color:var(--text-soft); line-height:1.5; }
  .modal-actions{ display:flex; gap:8px; justify-content:flex-end; }
  .btn{
    border:1px solid var(--line);
    background:transparent;
    color:var(--text);
    padding:8px 14px;
    border-radius:8px;
    font-size:13.5px;
    cursor:pointer;
  }
  .btn.primary{ background:var(--danger); border-color:var(--danger); color:#fff; }

  [hidden]{ display:none !important; }

  .toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%) translateY(8px);
    background:var(--teal);
    color:#fff;
    padding:9px 16px;
    border-radius:8px;
    font-size:13px;
    opacity:0;
    transition: opacity .18s ease, transform .18s ease;
    z-index:200;
    pointer-events:none;
  }
  @media (prefers-color-scheme: dark){ .toast{ color:#0e140f; } }
  :root[data-theme="dark"] .toast{ color:#0e140f; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce){
    .toast{ transition:none; }
  }

  ::selection{ background: color-mix(in srgb, var(--amber) 30%, transparent); }
</style>
</head>
<body>

<div class="totals-bar">
  <div class="totals-inner">
    <div class="totals-block">
      <span class="totals-num mono" id="totalHours">0.00</span>
      <span class="totals-label">hrs, this period</span>
    </div>
    <div class="totals-block">
      <span class="totals-num mono" id="totalPay">$0.00</span>
      <span class="totals-label">total pay</span>
    </div>
    <div class="rate-input-wrap">
      <span class="totals-label">$/hr</span>
      <input class="rate-input mono" id="rateInput" inputmode="decimal" value="0.00">
    </div>
  </div>
</div>

<div class="topbar">
  <div class="brandrow">
    <div class="brand">
      <h1>Timesheet</h1>
      <div class="sub">16 day entries · fast time entry</div>
    </div>
  </div>

  <div class="controls-row">
    <div class="controls-left">
      <button class="icon-btn" id="fillBtn">↓↓ Fill from Day 1</button>
    </div>
    <div class="controls-right">
      <button class="icon-btn" id="undoBtn" disabled>↶ Undo</button>
      <button class="icon-btn danger" id="clearAllBtn">Clear all</button>
    </div>
  </div>
</div>

<div class="sheet">
  <div class="col-headers">
    <div>Day</div>
    <div>Start</div>
    <div>End</div>
    <div style="text-align:right;">Hours</div>
  </div>
  <div id="rows"></div>
</div>

<div class="modal-overlay" id="clearAllModal" hidden>
  <div class="modal">
    <h3>Clear entire pay period?</h3>
    <p>This removes every start and end time entered so far. You can undo it right after if needed.</p>
    <div class="modal-actions">
      <button class="btn" id="clearAllCancel">Cancel</button>
      <button class="btn primary" id="clearAllConfirm">Clear all</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var NUM_DAYS = 16;
  var STORAGE_KEY = "twc_sheet_v2";
  var storageOk = true;

  function safeGet(key){
    try{ return localStorage.getItem(key); }catch(e){ storageOk=false; return null; }
  }
  function safeSet(key,val){
    try{ localStorage.setItem(key,val); }catch(e){ storageOk=false; }
  }

  // ---------- state ----------
  function blankDay(){ return { start:null, end:null }; }
  function blankState(){
    return {
      payRate: 0,
      days: Array.from({length:NUM_DAYS}, blankDay)
    };
  }

  var state = blankState();
  var history = []; // stack of JSON strings (pre-change snapshots)
  var HISTORY_MAX = 40;
  var saveTimer = null;

  function pushHistory(){
    history.push(JSON.stringify(state));
    if(history.length > HISTORY_MAX) history.shift();
    undoBtn.disabled = history.length === 0;
  }

  function scheduleSave(){
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      safeSet(STORAGE_KEY, JSON.stringify(state));
    }, 200);
  }

  function loadSheet(){
    var raw = safeGet(STORAGE_KEY);
    if(!raw) return blankState();
    try{
      var parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.days) && parsed.days.length === NUM_DAYS) return parsed;
    }catch(e){}
    return blankState();
  }

  // ---------- time math ----------
  function toMinutes(t){
    var h = t.h % 12;
    if(t.ap === 'PM') h += 12;
    return h*60 + t.m;
  }
  function hasHour(t){ return !!t && t.h !== null && t.h !== undefined && !isNaN(t.h); }
  function dailyMinutes(day){
    if(!hasHour(day.start) || !hasHour(day.end)) return null;
    var s = toMinutes(day.start), e = toMinutes(day.end);
    var diff = e - s;
    if(diff < 0) diff += 24*60;
    return diff;
  }
  function fmtHours(mins){
    return (mins/60).toFixed(2);
  }
  function fmtMoney(n){
    if(!isFinite(n)) n = 0;
    var neg = n < 0;
    n = Math.abs(n);
    var s = n.toFixed(2);
    return (neg ? "-$" : "$") + s;
  }
  function pad2(n){ return (n<10? "0":"") + n; }

  // ---------- DOM build ----------
  var rowsEl = document.getElementById('rows');
  var totalHoursEl = document.getElementById('totalHours');
  var totalPayEl = document.getElementById('totalPay');
  var rateInput = document.getElementById('rateInput');
  var fillBtn = document.getElementById('fillBtn');
  var undoBtn = document.getElementById('undoBtn');
  var clearAllBtn = document.getElementById('clearAllBtn');
  var clearAllModal = document.getElementById('clearAllModal');
  var clearAllCancel = document.getElementById('clearAllCancel');
  var clearAllConfirm = document.getElementById('clearAllConfirm');
  var toastEl = document.getElementById('toast');

  var rowRefs = []; // {el, dayTotal, start, end}

  function buildRow(i){
    var row = document.createElement('div');
    row.className = 'row';

    var dayLabel = document.createElement('div');
    dayLabel.className = 'daylabel';
    dayLabel.textContent = String(i+1);
    dayLabel.title = 'Day ' + (i+1);
    row.appendChild(dayLabel);

    var startField = buildTimeField(i, 'start');
    var endField = buildTimeField(i, 'end');

    var fieldsWrap1 = document.createElement('div');
    fieldsWrap1.className='timefield field-start';
    fieldsWrap1.appendChild(startField.el);
    row.appendChild(fieldsWrap1);

    var fieldsWrap2 = document.createElement('div');
    fieldsWrap2.className='timefield field-end';
    var arrow = document.createElement('span');
    arrow.className = 'arrow-sep';
    arrow.textContent = '\u2192';
    arrow.setAttribute('aria-hidden','true');
    fieldsWrap2.appendChild(arrow);
    fieldsWrap2.appendChild(endField.el);
    row.appendChild(fieldsWrap2);

    var foot = document.createElement('div');
    foot.className = 'rowfoot';

    var dayTotal = document.createElement('div');
    dayTotal.className = 'daytotal mono';
    dayTotal.textContent = '—';
    foot.appendChild(dayTotal);

    var actions = document.createElement('div');
    actions.className = 'rowactions';
    var copyBtn = document.createElement('button');
    copyBtn.type = 'button';
    copyBtn.className = 'row-btn';
    copyBtn.innerHTML = '&#8595;';
    copyBtn.title = 'Copy previous day';
    copyBtn.setAttribute('aria-label','Copy previous day into day ' + (i+1));
    copyBtn.addEventListener('click', function(){ copyPreviousDay(i); });
    if(i===0) copyBtn.style.display = 'none';
    var clearBtn = document.createElement('button');
    clearBtn.type = 'button';
    clearBtn.className = 'row-btn danger';
    clearBtn.innerHTML = '&times;';
    clearBtn.title = 'Clear this day';
    clearBtn.setAttribute('aria-label','Clear day ' + (i+1));
    armTwoStep(clearBtn, '&times;', function(){ clearDay(i); });
    actions.appendChild(copyBtn);
    actions.appendChild(clearBtn);
    foot.appendChild(actions);

    row.appendChild(foot);

    rowsEl.appendChild(row);
    rowRefs.push({
      el: row, dayTotal: dayTotal,
      start: startField, end: endField
    });
  }

  function buildTimeField(dayIdx, which){
    var wrap = document.createElement('div');
    wrap.style.display='flex';
    wrap.style.alignItems='center';
    wrap.style.gap='4px';

    var hourWrap = document.createElement('div');
    hourWrap.className='seg-num';
    var hourInput = document.createElement('input');
    hourInput.className='seg-input mono empty';
    hourInput.setAttribute('inputmode','numeric');
    hourInput.setAttribute('maxlength','2');
    hourInput.setAttribute('placeholder','--');
    hourInput.setAttribute('aria-label', 'Day ' + (dayIdx+1) + ' ' + which + ' hour');
    hourWrap.appendChild(hourInput);

    var colon = document.createElement('span');
    colon.className='colon';
    colon.textContent=':';

    var minWrap = document.createElement('div');
    minWrap.className='seg-num';
    var minInput = document.createElement('input');
    minInput.className='seg-input mono empty';
    minInput.setAttribute('inputmode','numeric');
    minInput.setAttribute('maxlength','2');
    minInput.setAttribute('placeholder','00');
    minInput.setAttribute('aria-label', 'Day ' + (dayIdx+1) + ' ' + which + ' minutes');
    minWrap.appendChild(minInput);

    var ampmBtn = document.createElement('button');
    ampmBtn.type='button';
    ampmBtn.className='ampm-btn am';
    ampmBtn.textContent = which === 'start' ? 'AM' : 'PM';
    ampmBtn.setAttribute('aria-label', 'Day ' + (dayIdx+1) + ' ' + which + ' AM or PM, tap to toggle');

    wrap.appendChild(hourWrap);
    wrap.appendChild(colon);
    wrap.appendChild(minWrap);
    wrap.appendChild(ampmBtn);

    var field = { el: wrap, hourInput: hourInput, minInput: minInput, ampmBtn: ampmBtn, dayIdx: dayIdx, which: which };
    wireTimeField(field);
    return field;
  }

  // ---------- field wiring ----------
  function getDayObj(dayIdx){ return state.days[dayIdx]; }
  function getTimeObj(dayIdx, which){ return getDayObj(dayIdx)[which]; }

  function ensureTimeObj(dayIdx, which){
    var day = getDayObj(dayIdx);
    if(!day[which]){
      day[which] = { h: null, m: 0, ap: which === 'start' ? 'AM' : 'PM' };
    }
    return day[which];
  }

  function clearTimeIfEmpty(dayIdx, which){
    var day = getDayObj(dayIdx);
    var t = day[which];
    if(t && (t.h === null || t.h === undefined)) day[which] = null;
  }

  function wireTimeField(field){
    var hourInput = field.hourInput, minInput = field.minInput, ampmBtn = field.ampmBtn;
    var dayIdx = field.dayIdx, which = field.which;

    hourInput.addEventListener('focus', function(){ hourInput.select(); });
    minInput.addEventListener('focus', function(){ minInput.select(); });

    hourInput.addEventListener('input', function(){
      var v = hourInput.value.replace(/[^0-9]/g,'').slice(0,2);
      hourInput.value = v;
      if(v.length === 0){
        commitHour(dayIdx, which, null);
        return;
      }
      var n = parseInt(v,10);
      if(v.length === 1 && n >= 2 && n <= 9){
        commitHour(dayIdx, which, n);
        focusNext(minInput);
        return;
      }
      if(v.length === 2){
        if(n < 1) n = 1;
        if(n > 12) n = 12;
        hourInput.value = String(n);
        commitHour(dayIdx, which, n);
        focusNext(minInput);
      }
    });
    hourInput.addEventListener('blur', function(){
      var v = hourInput.value.replace(/[^0-9]/g,'');
      if(v === ''){ commitHour(dayIdx, which, null); return; }
      var n = parseInt(v,10);
      if(n < 1) n = 1;
      if(n > 12) n = 12;
      hourInput.value = String(n);
      commitHour(dayIdx, which, n, true);
    });
    hourInput.addEventListener('wheel', function(e){
      e.preventDefault();
      var t = getTimeObj(dayIdx, which);
      var cur = (t && t.h) ? t.h : 12;
      var dir = e.deltaY > 0 ? -1 : 1;
      var next = ((cur - 1 + dir + 12) % 12) + 1;
      hourInput.value = String(next);
      commitHour(dayIdx, which, next, true);
    }, { passive:false });
    hourInput.addEventListener('keydown', function(e){
      if(e.key === 'ArrowUp' || e.key === 'ArrowDown'){
        e.preventDefault();
        var t = getTimeObj(dayIdx, which);
        var cur = (t && t.h) ? t.h : 12;
        var dir = e.key === 'ArrowUp' ? 1 : -1;
        var next = ((cur - 1 + dir + 12) % 12) + 1;
        hourInput.value = String(next);
        commitHour(dayIdx, which, next, true);
      } else if(e.key === 'Enter'){
        e.preventDefault();
        focusNext(minInput);
      }
    });

    minInput.addEventListener('input', function(){
      var v = minInput.value.replace(/[^0-9]/g,'').slice(0,2);
      minInput.value = v;
      if(v.length === 2){
        var n = parseInt(v,10);
        if(n > 59) n = 59;
        minInput.value = pad2(n);
        commitMinute(dayIdx, which, n);
        focusNext(ampmBtn);
      }
    });
    minInput.addEventListener('blur', function(){
      var v = minInput.value.replace(/[^0-9]/g,'');
      var n = v === '' ? 0 : parseInt(v,10);
      if(n > 59) n = 59;
      minInput.value = pad2(n);
      commitMinute(dayIdx, which, n, true);
    });
    minInput.addEventListener('wheel', function(e){
      e.preventDefault();
      var t = getTimeObj(dayIdx, which);
      var cur = t ? t.m : 0;
      var dir = e.deltaY > 0 ? -1 : 1;
      var next = (Math.round(cur/5)*5 + dir*5 + 60) % 60;
      minInput.value = pad2(next);
      commitMinute(dayIdx, which, next, true);
    }, { passive:false });
    minInput.addEventListener('keydown', function(e){
      if(e.key === 'ArrowUp' || e.key === 'ArrowDown'){
        e.preventDefault();
        var t = getTimeObj(dayIdx, which);
        var cur = t ? t.m : 0;
        var dir = e.key === 'ArrowUp' ? 1 : -1;
        var next = (Math.round(cur/5)*5 + dir*5 + 60) % 60;
        minInput.value = pad2(next);
        commitMinute(dayIdx, which, next, true);
      } else if(e.key === 'Enter'){
        e.preventDefault();
        focusNext(ampmBtn);
      }
    });

    ampmBtn.addEventListener('click', function(){
      toggleAmpm(dayIdx, which);
    });
    ampmBtn.addEventListener('keydown', function(e){
      if(e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'Enter'){
        e.preventDefault();
        toggleAmpm(dayIdx, which);
        if(e.key === 'Enter'){
          focusNext(nextFocusTargetAfterAmpm(dayIdx, which));
        }
      }
    });
  }

  function commitHour(dayIdx, which, val, isFinal){
    pushHistory();
    if(val === null){
      var day = getDayObj(dayIdx);
      day[which] = null;
    } else {
      var t = ensureTimeObj(dayIdx, which);
      t.h = val;
    }
    afterFieldChange(dayIdx);
  }
  function commitMinute(dayIdx, which, val){
    var day = getDayObj(dayIdx);
    if(!day[which]) return; // no hour set yet, ignore minute-only entry
    pushHistory();
    day[which].m = val;
    afterFieldChange(dayIdx);
  }
  function toggleAmpm(dayIdx, which){
    var day = getDayObj(dayIdx);
    pushHistory();
    if(!day[which]) day[which] = { h:null, m:0, ap: which==='start'?'AM':'PM' };
    day[which].ap = day[which].ap === 'AM' ? 'PM' : 'AM';
    afterFieldChange(dayIdx);
  }

  function focusNext(el){
    if(el && typeof el.focus === 'function') el.focus();
  }
  function nextFocusTargetAfterAmpm(dayIdx, which){
    var ref = rowRefs[dayIdx];
    if(which === 'start') return ref.end.hourInput;
    var next = rowRefs[dayIdx+1];
    return next ? next.start.hourInput : null;
  }

  // wire tab-order Enter-advance for ampm via click chain: after clicking ampm on start, we want easy jump.
  // Simplify: clicking start ampm keeps focus (already focused button); user presses Tab natively to continue.

  function afterFieldChange(dayIdx){
    renderRow(dayIdx);
    renderTotals();
    scheduleSave();
  }

  function renderRow(i){
    var ref = rowRefs[i];
    var day = getDayObj(i);
    syncFieldDisplay(ref.start, day.start);
    syncFieldDisplay(ref.end, day.end);
    var mins = dailyMinutes(day);
    if(mins === null){
      ref.dayTotal.textContent = '—';
      ref.el.classList.remove('filled');
    } else {
      ref.dayTotal.textContent = fmtHours(mins);
      ref.el.classList.add('filled');
    }
  }

  function syncFieldDisplay(field, t){
    var hourSet = t && t.h !== null && t.h !== undefined && !isNaN(t.h);
    if(hourSet){
      field.hourInput.value = String(t.h);
      field.hourInput.classList.remove('empty');
    } else {
      field.hourInput.value = '';
      field.hourInput.classList.add('empty');
    }
    if(t){
      field.minInput.value = pad2(t.m || 0);
      field.minInput.classList.toggle('empty', !hourSet);
      var ap = t.ap || (field.which === 'start' ? 'AM' : 'PM');
      field.ampmBtn.textContent = ap;
      field.ampmBtn.classList.toggle('pm', ap === 'PM');
      field.ampmBtn.classList.toggle('am', ap !== 'PM');
    } else {
      field.minInput.value = '00';
      field.minInput.classList.add('empty');
      var defAp = field.which === 'start' ? 'AM' : 'PM';
      field.ampmBtn.textContent = defAp;
      field.ampmBtn.classList.toggle('pm', defAp === 'PM');
      field.ampmBtn.classList.toggle('am', defAp !== 'PM');
    }
  }

  function renderAllRows(){
    for(var i=0;i<NUM_DAYS;i++) renderRow(i);
  }

  function renderTotals(){
    var totalMins = 0;
    for(var i=0;i<NUM_DAYS;i++){
      var m = dailyMinutes(state.days[i]);
      if(m !== null) totalMins += m;
    }
    var hrs = totalMins/60;
    totalHoursEl.textContent = hrs.toFixed(2);
    var pay = hrs * (state.payRate || 0);
    totalPayEl.textContent = fmtMoney(pay);
  }

  // ---------- two-step confirm (tap once to arm, tap again within a few seconds to confirm) ----------
  function armTwoStep(btn, armedLabel, action){
    var armed = false, timer = null;
    var restingHTML = btn.innerHTML;
    btn.addEventListener('click', function(){
      if(btn.disabled) return;
      if(!armed){
        armed = true;
        btn.classList.add('confirm-armed');
        btn.innerHTML = armedLabel;
        timer = setTimeout(disarm, 2500);
      } else {
        disarm();
        action();
      }
    });
    function disarm(){
      armed = false;
      btn.classList.remove('confirm-armed');
      btn.innerHTML = restingHTML;
      if(timer){ clearTimeout(timer); timer = null; }
    }
  }

  // ---------- row actions ----------
  function copyPreviousDay(i){
    if(i===0) return;
    pushHistory();
    var prev = state.days[i-1];
    state.days[i] = JSON.parse(JSON.stringify(prev));
    renderRow(i);
    renderTotals();
    scheduleSave();
    showToast('Copied day ' + i + ' into day ' + (i+1));
  }
  function clearDay(i){
    var day = state.days[i];
    if(!day.start && !day.end) return;
    pushHistory();
    state.days[i] = blankDay();
    renderRow(i);
    renderTotals();
    scheduleSave();
  }

  // ---------- fill remaining days from Day 1 ----------
  function fillRemainingFromDay1(){
    var day1 = state.days[0];
    if(!hasHour(day1.start) || !hasHour(day1.end)){
      showToast('Enter Day 1\u2019s start and end time first');
      return;
    }
    var toFill = [];
    for(var i=1;i<NUM_DAYS;i++){
      var d = state.days[i];
      if(!hasHour(d.start) && !hasHour(d.end)) toFill.push(i);
    }
    if(toFill.length === 0){
      showToast('Every day already has times \u2014 nothing to fill');
      return;
    }
    pushHistory();
    toFill.forEach(function(i){
      state.days[i] = JSON.parse(JSON.stringify(day1));
    });
    renderAllRows();
    renderTotals();
    scheduleSave();
    showToast('Filled ' + toFill.length + ' day' + (toFill.length===1?'':'s') + ' from Day 1');
  }

  // ---------- undo ----------
  function undo(){
    if(history.length === 0) return;
    var prev = history.pop();
    state = JSON.parse(prev);
    undoBtn.disabled = history.length === 0;
    renderAllRows();
    renderTotals();
    rateInput.value = (state.payRate || 0).toFixed(2);
    scheduleSave();
    showToast('Undone');
  }

  // ---------- clear all ----------
  function openClearAllModal(){
    clearAllModal.hidden = false;
  }
  function closeClearAllModal(){ clearAllModal.hidden = true; }
  function confirmClearAll(){
    pushHistory();
    state.days = Array.from({length:NUM_DAYS}, blankDay);
    renderAllRows();
    renderTotals();
    scheduleSave();
    closeClearAllModal();
    showToast('Pay period cleared');
  }

  // ---------- pay rate ----------
  rateInput.addEventListener('input', function(){
    var v = parseFloat(rateInput.value.replace(/[^0-9.]/g,''));
    if(isNaN(v)) v = 0;
    state.payRate = v;
    renderTotals();
    scheduleSave();
  });
  rateInput.addEventListener('blur', function(){
    rateInput.value = (state.payRate || 0).toFixed(2);
  });
  rateInput.addEventListener('focus', function(){ rateInput.select(); });

  // ---------- undo / clear / fill buttons ----------
  armTwoStep(undoBtn, '\u21B6 Confirm undo?', undo);
  fillBtn.addEventListener('click', fillRemainingFromDay1);
  clearAllBtn.addEventListener('click', openClearAllModal);
  clearAllCancel.addEventListener('click', closeClearAllModal);
  clearAllConfirm.addEventListener('click', confirmClearAll);
  clearAllModal.addEventListener('click', function(e){ if(e.target === clearAllModal) closeClearAllModal(); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && !clearAllModal.hidden) closeClearAllModal();
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){
      e.preventDefault();
      undo();
    }
  });

  // ---------- toast ----------
  var toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1600);
  }

  // ---------- init ----------
  function init(){
    for(var i=0;i<NUM_DAYS;i++) buildRow(i);

    state = loadSheet();

    renderAllRows();
    renderTotals();
    rateInput.value = (state.payRate || 0).toFixed(2);

    if(!storageOk){
      showToast('Storage unavailable — changes won\'t be saved after refresh');
    }

    // autofocus first empty start-hour field
    for(var j=0;j<NUM_DAYS;j++){
      if(!state.days[j].start){
        rowRefs[j].start.hourInput.focus();
        break;
      }
    }
  }

  init();
})();
</script>
